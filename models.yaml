# models.yaml — inference model registry (consumed by infer.py -> swift infer)
# ─────────────────────────────────────────────────────────────────────────
# One entry per model. Schema mirrors benchmarks/base.py::Model.from_dict:
#   tag              unique alias, used in preds/results folder names
#   path             HF repo id (resolved from cache) OR absolute local path
#   model_type       force ms-swift --model_type (e.g. qwen3_vl); needed for FT ckpts
#                    whose config matches qwen3_vl / _emb / _reranker (auto-match fails)
#   backend          "vllm" | "pt"                       (default: vllm)
#   enable_thinking  hybrid-thinking toggle              (omit -> model default)
#   min_pixels       Qwen-VL smart_resize lower bound    (image tokens)
#   max_pixels       Qwen-VL smart_resize upper bound
#   vllm_max_model_len  vLLM context cap (--vllm_max_model_len); omit -> model config
#                    default (Qwen3-VL = 262144), which sizes the KV cache to 262144
#                    and OOMs. 86016 covers spatialscore's true max seq (~80k: 32-image
#                    samples @ 2560 tok/img + prompt + 512 out) losslessly.
#   vllm_tensor_parallel_size  TP degree; OMIT to let infer.py auto-set it to the number
#                    of GPUs SLURM allocated (CUDA_VISIBLE_DEVICES). A 2-GPU job MUST use
#                    TP=2 or the model loads on one card and the KV cache starves (32B
#                    OOMs at 86016 on 1 card, fits comfortably split across 2).
#   vllm_engine_kwargs  raw pass-through to vLLM's EngineArgs, for knobs ms-swift has no
#                    dedicated flag for. Only set it when a model needs it.
#
# ★ min/max_pixels are the SpatialScore test_qwen.py protocol values
#   (AutoProcessor(min_pixels=256*28*28, max_pixels=2560*28*28)):
#     256*28*28  = 200704
#     2560*28*28 = 2007040
#   These MUST match the original eval or image-token counts diverge and the
#   scores are no longer comparable. Kept per-model (not in the adapter) because
#   the input jsonl is model-agnostic — infer.py injects them as swift flags.

models:
  # ── Qwen3-VL-Instruct (base, HF hub) ──────────────────────────────────────
  - tag: qwen3vl-2b
    path: Qwen/Qwen3-VL-2B-Instruct
    backend: vllm
    min_pixels: 200704
    max_pixels: 2007040
    vllm_max_model_len: 86016

  - tag: qwen3vl-4b
    path: Qwen/Qwen3-VL-4B-Instruct
    backend: vllm
    min_pixels: 200704
    max_pixels: 2007040
    vllm_max_model_len: 86016

  - tag: qwen3vl-8b
    path: Qwen/Qwen3-VL-8B-Instruct
    backend: vllm
    min_pixels: 200704
    max_pixels: 2007040
    vllm_max_model_len: 86016

  - tag: qwen3vl-32b
    path: Qwen/Qwen3-VL-32B-Instruct
    backend: vllm
    min_pixels: 200704
    max_pixels: 2007040
    vllm_max_model_len: 86016

  # ── Qwen3.5 (natively multimodal; Qwen2VLImageProcessorFast) ──────────────
  # enable_thinking: false — SpatialScore prompts want a direct, parseable answer
  # (letter / yes-no / scalar); thinking traces would break the output contract and
  # diverge from the original (Qwen2.5-VL, no thinking) eval.
  - tag: qwen3.5-2b
    path: Qwen/Qwen3.5-2B
    backend: vllm
    enable_thinking: false
    min_pixels: 200704
    max_pixels: 2007040
    vllm_max_model_len: 86016

  - tag: qwen3.5-4b
    path: Qwen/Qwen3.5-4B
    backend: vllm
    enable_thinking: false
    min_pixels: 200704
    max_pixels: 2007040
    vllm_max_model_len: 86016

  - tag: qwen3.5-9b
    path: Qwen/Qwen3.5-9B
    backend: vllm
    enable_thinking: false
    min_pixels: 200704
    max_pixels: 2007040
    vllm_max_model_len: 86016

  - tag: qwen3.5-27b
    path: Qwen/Qwen3.5-27B
    backend: vllm
    enable_thinking: false
    min_pixels: 200704
    max_pixels: 2007040
    vllm_max_model_len: 86016

  # ── SpatialCorpus SFT checkpoints ─────────────────────────────────────────
  # These live as SUBFOLDERS of the model repo haoningwu/SpatialScore (NOT the
  # dataset repo of the same name). infer.py resolves repo_id + subfolder to a local
  # checkpoint dir before inference (swift/vllm need a concrete model dir).
  - tag: qwen3vl-4b-sft-spatialcorpus
    path: haoningwu/SpatialScore
    subfolder: Qwen3-VL-4B_SpatialCorpus
    model_type: qwen3_vl          # ckpt config matches qwen3_vl / _emb / _reranker -> disambiguate
    backend: vllm
    min_pixels: 200704
    max_pixels: 2007040
    vllm_max_model_len: 86016
    # SpatialCorpus ckpts declare size.longest_edge=518400 in preprocessor_config.json (the
    # base models declare 16777216), so vLLM profiles ~506 tokens as the max for one image and
    # sizes its encoder cache at max(max_num_batched_tokens=2048, 506) = 2048. multihopspatial
    # runs unpinned (INFER_DEFAULTS pin_pixels=False), and 15 of its images are big enough to
    # need 2700-4800 embedding tokens -> "exceeds the pre-allocated encoder cache size 2048".
    # Raising max_num_batched_tokens raises the cache with it, WITHOUT changing image
    # resolution, so this model stays comparable to the others under upstream's protocol.
    vllm_engine_kwargs: {max_num_batched_tokens: 8192}

  - tag: qwen3vl-8b-sft-spatialcorpus
    path: haoningwu/SpatialScore
    subfolder: Qwen3-VL-8B_SpatialCorpus
    model_type: qwen3_vl          # ckpt config matches qwen3_vl / _emb / _reranker -> disambiguate
    backend: vllm
    min_pixels: 200704
    max_pixels: 2007040
    vllm_max_model_len: 86016
    # SpatialCorpus ckpts declare size.longest_edge=518400 in preprocessor_config.json (the
    # base models declare 16777216), so vLLM profiles ~506 tokens as the max for one image and
    # sizes its encoder cache at max(max_num_batched_tokens=2048, 506) = 2048. multihopspatial
    # runs unpinned (INFER_DEFAULTS pin_pixels=False), and 15 of its images are big enough to
    # need 2700-4800 embedding tokens -> "exceeds the pre-allocated encoder cache size 2048".
    # Raising max_num_batched_tokens raises the cache with it, WITHOUT changing image
    # resolution, so this model stays comparable to the others under upstream's protocol.
    vllm_engine_kwargs: {max_num_batched_tokens: 8192}

  # ── MultiHopSpatial finetune (etri-vilab, HF hub) ─────────────────────────
  - tag: mhs-qwen3vl-4b
    path: etri-vilab/MultiHopSpatial-Qwen3-VL-4B-Instruct
    model_type: qwen3_vl          # ckpt config matches qwen3_vl / _emb / _reranker -> disambiguate
    backend: vllm
    min_pixels: 200704
    max_pixels: 2007040
    vllm_max_model_len: 86016

  # ── OUR MultihopSpatial SFT (train/mhs_sft.py, LoRA r=64 on the MHS train split) ──
  # These reproduce the etri-vilab finetune above from the published recipe, so the pair
  # (mhs-qwen3vl-4b vs mhs-qwen3vl-4b-sft) is the comparison that matters.
  #
  # `path` points at a MERGED checkpoint, not the LoRA adapter dir: swift export --merge_lora
  # folds checkpoint-540 into the base weights, so these load exactly like every other entry
  # here. Serving the adapter through vLLM instead would need enable_lora + max_lora_rank>=64
  # (vLLM defaults to 16) and would put a different code path under these two models only —
  # the merged form keeps them comparable to the rest of the table.
  #   trained: 10 epochs, global batch 128, lr 5e-5, LoRA r=64/alpha=64/dropout 0.05,
  #            vit+aligner frozen, image tokens pinned to 256..1280 (the authors' bounds).
  # Rebuild with: swift export --adapters <sft>/mhs-<base>-lora/checkpoint-540 \
  #            --merge_lora true --output_dir <path below> --use_hf true --torch_dtype bfloat16
  #
  # NOTE the pixel bounds below are the SpatialScore protocol values, NOT the training
  # bounds (256*32*32 .. 1280*32*32). That is deliberate: multihopspatial declares
  # pin_pixels=False, so for MHS eval these are ignored entirely and the model sees its own
  # config default — matching upstream's evaluator, which pins nothing. They only take effect
  # if these checkpoints are ever run on spatialscore/refspatial (both of which we did run).
  - tag: mhs-qwen3vl-4b-sft
    path: /data2/seungwon/post_crisp/sft/merged/mhs-qwen3-vl-4b-instruct-lora-merged
    model_type: qwen3_vl          # ckpt config matches qwen3_vl / _emb / _reranker -> disambiguate
    backend: vllm
    min_pixels: 200704
    max_pixels: 2007040
    vllm_max_model_len: 86016

  - tag: mhs-qwen3.5-4b-sft
    path: /data2/seungwon/post_crisp/sft/merged/mhs-qwen3.5-4b-lora-merged
    model_type: qwen3_5
    backend: vllm
    enable_thinking: false        # same as the qwen3.5-* base entries: SFT targets are a bare
                                  # "Answer: ... / Bounding Box: ..." pair, no thinking trace
    min_pixels: 200704
    max_pixels: 2007040
    vllm_max_model_len: 86016